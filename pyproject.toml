[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "py-ruvseq-omicverse"
version = "0.1.0"
description = "Reference-validated py-RUVSeq algorithm subset"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23", "scipy>=1.10", "pandas>=1.5"]
[project.optional-dependencies]
test = ["pytest>=7"]
[tool.setuptools.packages.find]
include = ["pyruvseq*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
